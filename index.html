<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChessMeet | Find Free Places to Play Chess</title>

  <!-- Tailwind CSS (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS (With Integrity & Crossorigin) -->
  <link 
    rel="stylesheet" 
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
    crossorigin="" 
  />
  <script 
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
    crossorigin="">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-900 flex flex-col h-screen">

<!-- Header -->
<header class="bg-indigo-700 text-white p-4 shadow-md flex justify-between items-center z-10">
<!-- Left Side -->
  <div class="text-left text-indigo-100 font-medium truncate">
    Find free places to play chess in person
  </div>

  <!-- Center -->
  <div class="text-center font-bold text-2xl tracking-wide whitespace-nowrap">
    ♟️ ♙ ChessMeet ♙ ♟️
  </div>

  <!-- Right Side -->
  <div class="text-right text-indigo-100 font-medium truncate">
    No membership. No entry fees. Just show up and play.
  </div>
  <!-- Submit Spot Button -->
  <button onclick="toggleModal(true)" class="bg-white text-indigo-700 px-3 py-1.5 rounded-lg text-sm font-semibold shadow hover:bg-indigo-50 whitespace-nowrap ml-3">
    + Submit a New Spot
  </button>
</header>

  <div class="bg-white p-3 shadow-sm flex flex-wrap gap-2 items-center justify-between z-10">
    <div class="flex flex-1 gap-2 min-w-[250px]">
      <input type="text" id="searchInput" placeholder="Search New York..." class="w-full border rounded-lg px-3 py-1.5 text-sm focus:outline-indigo-500">
      <button onclick="searchSpots()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium">Search</button>
    </div>
    
    <div class="flex gap-2 w-full sm:w-auto">
      <button onclick="locateUser()" class="bg-gray-200 text-gray-800 px-3 py-1.5 rounded-lg text-sm font-medium flex-1 sm:flex-none">
        📍 Near Me
      </button>
      <select id="envFilter" onchange="fetchSpots()" class="border rounded-lg px-2 py-1.5 text-sm flex-1 sm:flex-none">
        <option value="all">All Locations</option>
        <option value="indoor">Indoor</option>
        <option value="outdoor">Outdoor</option>
        <option value="both">Both</option>
      </select>
    </div>
  </div>

<!-- Middle Area: Map takes all remaining vertical space -->
  <main class="flex-1 relative z-0">
    <div id="map" class="absolute inset-0 w-full h-full"></div>
  </main>
<!-- Bottom-Left Author Credit Label -->
  <footer class="shrink-0 bg-white border-t border-gray-200 py-2 px-4 text-center relative z-30">
    <p class="text-xs text-blue-500 pointer-events-auto">
        ♟️ Created by chess enthusiast <span class="font-medium text-gray-700">Charles Chen</span> |♙| 
        <a href="mailto:chfchen08@gmail.com?subject=ChessMeet Inquiry / Feedback" 
           class="text-red-600 hover:text-red-700 font-semibold underline transition-colors cursor-pointer relative z-40">
          Contact ChessMeet for Inqury or Comment ♟️
        </a>
    </p>
  </footer>
<!-- Submission Modal -->
<div id="submitModal" class="fixed inset-0 bg-black/60 hidden z-[9999] flex justify-center items-center p-4">
  <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 max-h-[90vh] overflow-y-auto relative my-auto">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-bold text-gray-900">Submit a Public Chess Spot</h2>
      <button onclick="toggleModal(false)" class="text-gray-500 hover:text-gray-800 text-2xl font-bold p-1 leading-none">&times;</button>
    </div>
    
    <form id="spotForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
      <div>
        <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Place Name*</label>
        <input type="text" id="title" required placeholder="e.g. Bryant Park" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      <!-- Street Address (Optional) -->
      <div>
        <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">
          Street Address <span class="text-gray-400 font-normal lowercase">(if known, optional, or nearby street address)</span>
        </label>
        <input type="text" id="address" placeholder="e.g. 42nd Street and 6th Avenue" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      <div class="flex gap-2">
        <div class="flex-1">
          <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">City*</label>
          <input type="text" id="city" required value="New York" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="w-24">
          <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">State*</label>
          <input type="text" id="state" required value="NY" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
      </div>
      <!-- Coordinates (Optional) -->
      <div>
        <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">
          Coordinates (Latitude, Longitude) <span class="text-gray-400 font-normal lowercase">(if known, optional)</span>
        </label>
        <div class="flex gap-2">
          <input type="text" step="any" id="lat" placeholder="Latitude (e.g. 40.7536)" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          <input type="text" step="any" id="lng" placeholder="Longitude (e.g. -73.9832)" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
      </div>
      <div class="flex gap-2">
        <div class="flex-1">
          <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Environment*</label>
          <select id="environment" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="outdoor">Outdoor</option>
            <option value="indoor">Indoor</option>
            <option value="both">Both</option>
          </select>
        </div>
        <div class="flex-1">
          <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Tables Available*(approx)</label>
          <input type="number" id="total_tables" value="10" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
      </div>
      <div class="flex items-center gap-2 py-1">
        <input type="checkbox" id="has_permanent_tables" class="w-4 h-4 text-indigo-600 rounded">
        <label for="has_permanent_tables" class="text-sm font-medium text-gray-700">Complete chess set provided on-site</label>
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Typical Playing Times (Optional)</label>
        <input type="text" id="peak_playing_times" placeholder="e.g. Park Time 8AM - 9PM" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Description / Notes</label>
        <textarea id="description" rows="2" placeholder="e.g. Inside park near 42nd Street. Table locations may shift from time to time due to park events." class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
      </div>
      
      <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-lg hover:bg-indigo-700 transition shadow-md mt-2">
        Submit Spot for Review
      </button>
    </form>
  </div>
</div>

  <script>
    // 1. Initialize Supabase
    const SUPABASE_URL = 'https://txkyvcrhsjcdvdozspob.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4a3l2Y3Joc2pjZHZkb3pzcG9iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NjE4NjEsImV4cCI6MjEwMzQzNzg2MX0._PfuxJkCzNAFw4BtJe7RPAPX7jyWfXXqaFb28l-9vG0';
    
    // Assign to 'supabase' so all your fetch and insert functions can use `supabase.from(...)`
    // const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    // 2. Initialize Map (Default centered on Houston/Katy area)
    const map = L.map('map').setView([29.7604, -95.3698], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let markersGroup = L.layerGroup().addTo(map);

    // 3. Fetch and Render Approved Spots
    async function fetchSpots() {
      const env = document.getElementById('envFilter').value;
      
      let query = supabase.from('chess_spots').select('*').eq('status', 'approved');
      if (env !== 'all') {
        query = query.eq('environment', env);
      }

      const { data, error } = await query;
      if (error) {
        console.error('Error fetching spots:', error);
        return;
      }

      markersGroup.clearLayers();

      data.forEach(spot => {
        const popupContent = `
          <div class="p-1 max-w-xs">
            <h3 class="font-bold text-base text-indigo-700">${spot.title}</h3>
            <p class="text-xs text-gray-600 mb-2">${spot.address}, ${spot.city}</p>
            <div class="text-xs space-y-1">
              <p><strong>Type:</strong> <span class="capitalize">${spot.environment}</span></p>
              <p><strong>Tables:</strong> ${spot.has_permanent_tables ? 'Permanent Tables Built-in' : 'Bring Your Own Board (BYOB)'} (${spot.total_tables} available)</p>
              <p><strong>Popular Times:</strong> ${spot.peak_playing_times || 'Anytime'}</p>
              ${spot.description ? `<p class="italic text-gray-500 mt-1 font-sans">"${spot.description}"</p>` : ''}
            </div>
            <a href="https://www.google.com/maps/dir/?api=1&destination=${spot.latitude},${spot.longitude}" target="_blank" class="inline-block mt-3 text-xs bg-indigo-600 text-white px-2.5 py-1 rounded">Get Directions</a>
          </div>
        `;
        L.marker([spot.latitude, spot.longitude]).addTo(markersGroup).bindPopup(popupContent);
      });
    }

    // 4. Geolocation ("Near Me")
    function locateUser() {
      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser");
        return;
      }
      navigator.geolocation.getCurrentPosition(pos => {
        const { latitude, longitude } = pos.coords;
        map.setView([latitude, longitude], 14);
        L.circle([latitude, longitude], { radius: 300, color: '#4F46E5' }).addTo(map);
      }, () => alert("Unable to retrieve your location"));
    }

    // 5. City / Location Search (Geocoding via Nominatim)
    async function searchSpots() {
      const query = document.getElementById('searchInput').value;
      if (!query) return;

      const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
      const data = await response.json();

      if (data && data.length > 0) {
        const { lat, lon } = data[0];
        map.setView([lat, lon], 12);
      } else {
        alert("Location not found.");
      }
    }

    // 6. Handle Modal & Form Submission
    function toggleModal(show) {
      document.getElementById('submitModal').classList.toggle('hidden', !show);
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const newSpot = {
        title: document.getElementById('title').value,
        address: document.getElementById('address').value,
        city: document.getElementById('city').value,
        state: document.getElementById('state').value,
        latitude: parseFloat(document.getElementById('lat').value),
        longitude: parseFloat(document.getElementById('lng').value),
        environment: document.getElementById('environment').value,
        has_permanent_tables: document.getElementById('has_permanent_tables').checked,
        total_tables: parseInt(document.getElementById('total_tables').value) || 0,
        peak_playing_times: document.getElementById('peak_playing_times').value,
        description: document.getElementById('description').value,
        status: 'pending'
      };

      const { error } = await supabase.from('chess_spots').insert([newSpot]);

      if (error) {
        alert("Error submitting spot. Please try again.");
      } else {
        alert("Thank you! Your spot submission was received and is pending approval.");
        document.getElementById('spotForm').reset();
        toggleModal(false);
      }
    }

    // Initial Load
    fetchSpots();
  </script>

</body>
</html>
